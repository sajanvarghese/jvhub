{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Customer Dashboard{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
    }
    .content {
      padding: 30px;
    }
/* Initial color */
/* Navbar links default */
.navbar-nav .nav-link,
.navbar-brand {
    color: #6c757d; /* Light grey text */
    transition: background-color 0.3s, color 0.3s;
    border-radius: 5px; /* optional rounded highlight */
    padding: 5px 10px;
    text-decoration: none;
}

/* Hover effect */
.navbar-nav .nav-link:hover,
.navbar-brand:hover {
    background-color: #e9ecef; /* Light grey background on hover */
    color: #495057; /* Darker grey text on hover */
}


  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm mb-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'user_dashboard' %}"> Products</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
<div class="collapse navbar-collapse" id="navbarNav">
    <!-- Search form -->
    <form class="d-flex me-3" method="GET" action="{% url 'user_dashboard' %}">
        <input type="text" class="form-control me-2" name="q" placeholder="Search product..." value="{{ request.GET.q }}">
        <button class="btn btn-outline-primary" type="submit">Search</button>
    </form>

    <!-- Navbar items -->
    <ul class="navbar-nav ms-auto">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'my_orders' %}"> My Orders</a>
        </li>
<li class="nav-item position-relative">
    <a class="nav-link" href="{% url 'customer_notifications' %}">
        Notifications
        {% if unread_count > 0 %}
        <span class="badge bg-danger rounded-pill position-absolute"
              style="top:0; right:0; transform: translate(50%, -50%);">
            {{ unread_count }}
        </span>
        {% endif %}
    </a>
</li>

        <li class="nav-item dropdown">
<a class="nav-link dropdown-toggle" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown">
    <i class="bi bi-person-circle"></i> {{ request.user.username }}
</a>

            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
              <li><a class="dropdown-item" href="{% url 'customer_profile' %}">View Profile</a></li>
              <li><a class="dropdown-item" href="{% url 'edit_customer_profile' %}">Edit Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="{% url 'admin_logout' %}">Logout</a></li>
            </ul>
        </li>
    </ul>
</div>

    </div>
  </nav>

  <!-- Main Content -->
  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
